<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-label="Three ways of covering industrial real estate: top-down market selection, bottom-up property leaseability, and research on alternative data" font-family="Rubik, system-ui, sans-serif" font-size="12.5">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a847c"/></marker>
  </defs>
  <g fill="#fff" stroke="#8a847c" stroke-width="1.25">
    <rect x="24" y="24" width="208" height="244" rx="10"/>
    <rect x="276" y="24" width="208" height="244" rx="10"/>
    <rect x="528" y="24" width="208" height="244" rx="10"/>
  </g>
  <g stroke="#e4e2de"><line x1="40" y1="186" x2="216" y2="186"/><line x1="292" y1="186" x2="468" y2="186"/><line x1="544" y1="186" x2="720" y2="186"/></g>
  <g fill="none" stroke="#8a847c" stroke-width="1.25">
    <path d="M236 84H272" marker-end="url(#b)"/><path d="M488 84H524" marker-end="url(#b)"/>
  </g>
  <g font-family="Roboto Mono, monospace" font-size="11" font-weight="600" fill="#b4491f" letter-spacing="1">
    <text x="40" y="52">TOP-DOWN</text><text x="292" y="52">BOTTOM-UP</text><text x="544" y="52">RESEARCH</text>
  </g>
  <g font-size="15" font-weight="600" fill="#161616">
    <text x="40" y="78">Market selection</text><text x="292" y="78">Property leaseability</text><text x="544" y="78">Alt-data signal testing</text>
  </g>
  <g fill="#5c5c5c">
    <text x="40" y="100">Which markets will lead?</text><text x="292" y="100">How fast will it lease?</text><text x="544" y="100">Does outside data help?</text>
  </g>
  <g fill="#161616">
    <text x="40" y="132">Beta-regression occupancy</text><text x="40" y="152">forecast + rent momentum</text><text x="40" y="172">~100 US markets, by size</text>
    <text x="292" y="132">Discrete-time survival</text><text x="292" y="152">model, lease-up curve</text><text x="292" y="172">~525K buildings, quarterly</text>
    <text x="544" y="132">Entity resolution, then</text><text x="544" y="152">one tercile test engine</text><text x="544" y="172">for every data source</text>
  </g>
  <g font-size="11.5" fill="#5c5c5c">
    <text x="40" y="212">Challenge: fundamentals are</text><text x="40" y="230">reported late, revised later</text>
    <text x="292" y="212">Challenge: many buildings still</text><text x="292" y="230">vacant, lease date unknown</text>
    <text x="544" y="212">Challenge: no shared key</text><text x="544" y="230">between datasets and leases</text>
  </g>
</svg>
